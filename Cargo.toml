[workspace]
resolver = "2"
members = [
    "crates/tisp-core",
    "crates/tisp-frontend",
    "crates/tisp-middle",
    "crates/tisp-backend",
    "crates/tisp-runtime",
    "crates/tisp-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "NO LICENSE"
repository = "https://github.com/tisp-lang/tisp"

[workspace.dependencies]
tisp-core = { path = "crates/tisp-core" }
tisp-frontend = { path = "crates/tisp-frontend" }
tisp-middle = { path = "crates/tisp-middle" }
tisp-backend = { path = "crates/tisp-backend" }
tisp-runtime = { path = "crates/tisp-runtime" }

logos = "0.14"
im = "15"
ariadne = "0.4"
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rustyline = "14"
petgraph = "0.6"
unicode-xid = "0.2"
inkwell = { version = "0.5", features = ["llvm17-0"] }
# llvm-sys 直接依赖:强制动态链接(Debian llvm-17-dev 只有共享库,默认 prefer-static 会
# 因缺少 libPolly.a 等静态库而构建失败)
llvm-sys = { version = "170", features = ["force-dynamic"] }
libloading = "0.8"
chacha20 = "0.9"
sha2 = "0.10"
